# Builds the thing a customer downloads, on a real Windows machine.
#
# WHY IT CANNOT BE BUILT WHERE THE CODE IS WRITTEN. A Windows installer is a
# Windows program: it embeds an icon and a version resource, and later it has
# to be signed by the Windows signing tool. Cross-building it from Linux works
# through Wine until the day it quietly does not, and the failure lands on a
# customer's machine rather than in a log anybody reads. So it is built where
# it runs.
#
# WHY A RELEASE AND NOT AN ARTIFACT. A workflow artifact requires a GitHub
# account and a login. A release asset is a plain URL — and, more to the point,
# it is the feed an INSTALLED copy reads to update itself. That is the whole
# reason the release exists now: so that a fix reaches a customer's machine
# without anybody sending them anything.
#
# THE RELEASE GOES TO THIS REPOSITORY, and the one property that matters is
# that it is PUBLIC: a private repository's release assets need a token to
# download, and the only way to give an installed copy one is to put it inside
# the installer — handing every customer a credential. The check below asks
# GitHub anonymously, exactly as an installed copy asks, and refuses to publish
# if the answer is ever anything else.
#
# IT USED TO GO TO A SEPARATE REPOSITORY, on the belief that the source was
# private. It is not, and never was. What the separate feed actually bought was
# a dependency on a hand-made token — which was issued read-only, so for days
# every build produced a good installer and then had its release refused at the
# last step, and not one installed copy could see it. Publishing here needs no
# token at all: GitHub issues every workflow one for its own repository (see
# `permissions:` below), scoped to the run and gone when it ends.
name: build the downloadable app

on:
  push:
    tags: ['app-v*']
    # Also whenever the desktop app itself changes. Two reasons: a build that
    # only ever runs at release time first breaks weeks after the change that
    # broke it, and — more immediately — this session can push to the branch
    # but not create tags (the token answers 403), so without this there is no
    # way to produce the package at all.
    branches: [claude/facebook-content-manager-gqtv66]
    paths:
      - 'desktop/**'
      - 'scripts/build-app.mjs'
      - 'electron-builder.yml'
      - 'worker/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish it as a release people can download'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ELECTRON IS INSTALLED HERE AND IS NOT IN package.json, on purpose.
      #
      # It was a devDependency for about ninety minutes and it took the live
      # website down. Vercel installs from the same manifest, electron's
      # postinstall fetches a few hundred megabytes of browser binary, and the
      # production build stopped completing — so anx-ggyo.vercel.app served a
      # 404 for two and a half hours while the owner was trying to use it.
      # Nothing the website ships needs electron; only this job does. So this
      # job is where it lives, and worker/test/package.test.ts fails the build
      # if it ever creeps back into the manifest. electron-updater is here for
      # the same reason and is caught by the same guard — it is bundled into
      # main.cjs by scripts/build-app.mjs, so it has to exist at build time and
      # must never exist at Vercel time.
      - name: electron, for this job only
        run: npm install --no-save --no-audit --no-fund electron@38 electron-builder@26 electron-updater@6

      # The shell is typechecked HERE, because this is the only place Electron's
      # types exist. Without this step nothing would compile desktop/main.ts at all
      # and a type error would first appear as a broken installer.
      - name: typecheck the desktop shell
        run: npx tsc -p desktop/tsconfig.json --noEmit

      # The package must carry no secret, and that is checked rather than
      # trusted: the test builds it with fake secrets in the environment and
      # then greps every byte of the output for them.
      - name: the package identifies nobody
        run: npx tsx worker/test/package.test.ts

      # The two public values, and they come from the repository secrets ONLY.
      #
      # THERE IS NO DEFAULT HERE, AND THAT IS DELIBERATE. There was one for an
      # hour: the literals in deploy.yml. But deploy.yml publishes to GitHub
      # Pages, while the site customers use is built by VERCEL from variables
      # kept in Vercel — which nothing in this repository can read. The two had
      # drifted apart, and the fallback was quietly pointing every installer at
      # a project where no customer's account exists. A wrong default is worse
      # than no default: it turns "this build is not configured" into "this
      # build is configured incorrectly", and only one of those announces
      # itself.
      #
      # So the values must be set, as repository secrets, to whatever Vercel
      # holds — and the step after this one checks that against the live site
      # rather than taking anyone's word for it.
      #
      # The anon key is the one that already ships in every browser bundle of
      # the website; what it can reach is decided by the row-level policies
      # behind it. Nothing else is passed in — see scripts/build-app.mjs.
      - name: assemble
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # An unset repository variable arrives as the EMPTY STRING, which is
          # not "unset" — so the default belongs here as well as in the script.
          SOCIAL_SITE_URL: ${{ vars.SOCIAL_SITE_URL || 'https://anx-ggyo.vercel.app/social' }}
        run: node scripts/build-app.mjs

      - name: the package asks the same database as the live dashboard
        shell: pwsh
        env:
          SITE: ${{ vars.PRODUCTION_URL || 'https://anx-ggyo.vercel.app' }}
        run: |
          $cfg = Get-Content dist/app/config.json | ConvertFrom-Json
          if (-not $cfg.supabaseUrl -or -not $cfg.supabaseAnonKey) {
            # An installer that builds fine and cannot connect is the worst of
            # the possible outcomes: it reaches a customer before anybody knows.
            throw "NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY are not set as repository secrets. Copy them from Vercel (Project -> Settings -> Environment Variables) into GitHub (Settings -> Secrets and variables -> Actions), under the same two names."
          }
          # AND THE WAY TO THE WEBSITE, which this guard did not check and a
          # shipped installer therefore went out without. Everything it reaches
          # is dead when it is empty: "צור חשבון חדש" on the sign-in screen and
          # "הדשבורד באתר" in the tray both open nothing, so a customer who does
          # not already have an account has no way to make one.
          if (-not $cfg.siteUrl) {
            throw "config.json has no siteUrl, so 'צור חשבון חדש' and 'הדשבורד באתר' would do nothing in the installed app. Set the SOCIAL_SITE_URL repository variable, or leave it unset to take the default."
          }
          $mine = ([uri]$cfg.supabaseUrl).Host.Split('.')[0]
          $live = ''
          try {
            $live = (Invoke-RestMethod -Uri "$env:SITE/api/version" -TimeoutSec 30).db
          } catch {
            # A build must not fail because a website was slow for ten seconds.
            # Said loudly rather than silently, so a run that skipped the check
            # does not read like a run that passed it.
            Write-Host "::warning::could not reach $env:SITE/api/version — the database match was NOT verified on this build."
          }
          if (-not $live) {
            Write-Host "::warning::the live site reported no database — deploy the version that reports it, then build again to have this checked."
          } elseif ($mine -ne $live) {
            throw "This installer asks a DIFFERENT database than the live dashboard (installer: $mine, site: $live). Every customer's login would be refused with 'wrong email or password', because their account exists in the site's project and not in this one. Set the NEXT_PUBLIC_SUPABASE_URL and _ANON_KEY repository secrets to the values Vercel uses."
          } else {
            # Printed as the project reference, which is public, and never the
            # key. This line is the whole diagnosis when a customer cannot sign
            # in: same database, or not.
            Write-Host "installer and live dashboard share one database: $mine"
          }

      # CODE SIGNING. Without it Windows SmartScreen tells the customer this is
      # an unrecognised app from an unknown publisher, which is a reasonable
      # thing for it to say and a bad thing for them to read. A certificate is
      # a few hundred dollars a year; until there is one, these two secrets are
      # simply absent and electron-builder skips signing.
      - name: build the installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npx electron-builder --win nsis --config electron-builder.yml --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: hapitaron-windows
          path: |
            dist/installer/*.exe
          if-no-files-found: error

      # ------------------------------------------------------------------
      # THE UPDATE FEED, which is the thing that replaces sending a link.
      #
      # An installed copy checks a PUBLIC repository that holds the installer
      # and nothing else (see `publish:` in electron-builder.yml). This is the
      # step that puts a version there.
      #
      # IT PUBLISHES ONLY WHEN THE VERSION IS NEW. The build runs on every push
      # that touches the app, which is often; re-uploading the same version
      # over itself would mean replacing files that customers may be
      # downloading at that second, for no gain. So the version in the package
      # is compared against what is already published — bump WORKER_VERSION in
      # src/lib/social/worker-version.ts and the next push ships; leave it and
      # the build still produces an artifact and touches nothing public.
      - name: is this version already out there?
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content dist/app/package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          # NO HAND-MADE TOKEN IS INVOLVED ANY MORE.
          #
          # This step used to stop here unless an UPDATES_TOKEN secret existed,
          # because the release went to a different repository and only a
          # personal token can write across repositories. That token was issued
          # with Contents: Read-only, and for days every build ended the same
          # way: a perfectly good installer, and a publish refused at the last
          # step, with nobody's copy able to update.
          #
          # The release goes to THIS repository now, and GitHub hands every
          # workflow a token for its own repository — see `permissions:
          # contents: write` at the top of this file. Nothing to create,
          # nothing to scope, nothing to forget.

          # IS THE FEED THERE, AND CAN A STRANGER READ IT?
          #
          # ASKED TWICE, AND THE SECOND ASK IS THE REASON THIS WORKS.
          #
          # The first version asked once, without credentials — the way an
          # installed copy asks — and treated ANY failure as "the repository is
          # missing or private". That is wrong in a way that wastes a night:
          # unauthenticated API calls from Actions runners share an IP and a
          # tiny hourly budget, so a rate limit arrives as a failure too, and
          # the build then reports a perfectly good repository as absent. It
          # did exactly that, twice, while the repository sat there public.
          #
          # So: ask anonymously, and if that does not answer, ask again WITH
          # the token, which is not rate limited and can say which of the three
          # things is actually true. Each gets its own sentence, and a rate
          # limit is no longer allowed to impersonate a missing repository.
          $feed = 'stasix12/ANX-'
          $head = @{ 'User-Agent' = 'hapitaron-build'; 'Accept' = 'application/vnd.github+json' }
          $anon = Invoke-WebRequest -Uri "https://api.github.com/repos/$feed" -Headers $head -SkipHttpErrorCheck
          Write-Host "feed as a stranger sees it: HTTP $($anon.StatusCode)"

          $withKey = Invoke-WebRequest -Uri "https://api.github.com/repos/$feed" -Headers ($head + @{ Authorization = "Bearer $env:GITHUB_TOKEN" }) -SkipHttpErrorCheck
          Write-Host "feed as the build sees it: HTTP $($withKey.StatusCode)"

          if ($withKey.StatusCode -eq 404) {
            Write-Host "::warning::$feed does not answer even to this build's own token, which should be impossible — the name in this workflow and in electron-builder.yml must be the repository this workflow runs in."
            "publish=no" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($withKey.StatusCode -ne 200) {
            Write-Host "::warning::could not read $feed (HTTP $($withKey.StatusCode)). Nothing was published on this build."
            "publish=no" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (($withKey.Content | ConvertFrom-Json).private) {
            # Not a warning. A private feed is a package that can never update
            # itself, and shipping one quietly is the failure this whole step
            # exists to prevent.
            throw "$feed is PRIVATE. An installed copy has no login, so it could never download from it — and giving it one would put a credential inside every customer's app. Either make this repository public again, or move the update feed to a separate public repository (change `publish:` in electron-builder.yml and the feed name in this workflow, and give the build a token that may write there)."
          }
          if ($anon.StatusCode -ne 200) {
            # The token can read it and a stranger momentarily could not, which
            # at this point means the shared rate limit rather than anything
            # about the repository. Said out loud, and carried on with.
            Write-Host "::notice::the anonymous check did not answer (HTTP $($anon.StatusCode)) — almost certainly the runner's shared rate limit. The repository is public, so publishing continues."
          }
          # CAN THE TOKEN WRITE THERE? NOT ANSWERABLE FROM HERE.
          #
          # This used to test permissions.push from the repository response and
          # let the build through when it was true. It is always true: that
          # field describes what the USER may do with the repository, not what
          # this TOKEN was granted. So the check passed, 344 MB went up, and
          # the publish failed at the end anyway — a green tick on a question
          # that was never asked, which is worse than no check at all.
          #
          # GitHub exposes no way to read a fine-grained token's own grants,
          # and the only honest alternative — attempting a write to find out —
          # is not a check, it is the thing itself. So the answer is left to
          # the publish, and what changed is that its failure is now READ: see
          # the step below, which turns the one line that matters out of a
          # forty-line stack trace into an instruction.
          Write-Host "update feed ready: $feed (readable; write access is proven by the publish itself)"

          $url = "https://api.github.com/repos/$feed/releases/tags/v$version"
          try {
            Invoke-RestMethod -Uri $url -Headers @{ 'User-Agent' = 'hapitaron-build' } | Out-Null
            Write-Host "v$version is already published. Bump WORKER_VERSION to ship a new one."
            "publish=no" >> $env:GITHUB_OUTPUT
          } catch {
            # NEW IS NOT THE SAME AS NEWER.
            #
            # The only gate here was "does this tag exist". Type 3.5.0 where you
            # meant 3.55.0 — a plausible slip on a product already past 3.53 —
            # and that is a brand-new tag, so it publishes, becomes the newest
            # release every installed copy reads, and is LOWER than what they
            # have. electron-updater refuses downgrades, so every machine
            # reports itself current and never updates again. A typo would
            # freeze the whole fleet, permanently, with nothing anywhere saying
            # so.
            $out = Invoke-WebRequest -Uri "https://api.github.com/repos/$feed/releases/latest" -Headers $head -SkipHttpErrorCheck
            if ($out.StatusCode -eq 200) {
              $already = ($out.Content | ConvertFrom-Json).tag_name -replace '^v', ''
              if ($already -and [version]$version -le [version]$already) {
                throw "This build is version $version and the published one is $already. Publishing it would make the newest release OLDER than what customers already have — every installed copy would then report itself up to date and never update again. Raise WORKER_VERSION in src/lib/social/worker-version.ts."
              }
              Write-Host "v$version is newer than the published v$already — publishing."
            } else {
              Write-Host "nothing published yet — v$version is the first."
            }
            "publish=yes" >> $env:GITHUB_OUTPUT

            # THE RELEASE IS CREATED HERE, ONCE, BEFORE ANYTHING UPLOADS.
            #
            # electron-builder starts one publisher per file and each of them
            # checks "does the release exist?" and creates it if not. With two
            # files that is two checks and two creates, a few milliseconds
            # apart, both answering "doesn't exist" — and GitHub refused the
            # loser with 422 "Published releases must have a valid tag".
            #
            # What that left behind was worse than a failed build: a release
            # holding the installer and NOT latest.yml, sitting at
            # /releases/latest, which is the one file an installed copy reads.
            # Every machine asking for an update got nothing, from a release
            # that looked perfectly fine on the page.
            #
            # Creating it up front makes the race impossible: both publishers
            # find it and both just upload. target_commitish is the commit this
            # build ran on, so the tag it creates always points at real code.
            $make = @{ tag_name = "v$version"; name = $version; target_commitish = $env:GITHUB_SHA; draft = $false; prerelease = $false } | ConvertTo-Json
            $auth = $head + @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
            $made = Invoke-WebRequest -Method Post -Uri "https://api.github.com/repos/$feed/releases" -Headers $auth -Body $make -ContentType 'application/json' -SkipHttpErrorCheck
            if ($made.StatusCode -eq 201) {
              Write-Host "release v$version created up front — the uploads have somewhere to land"
            } elseif ($made.StatusCode -eq 422) {
              # Already there, which is the other way this is safe to run.
              Write-Host "release v$version already exists — uploading into it"
            } else {
              throw "Could not create release v$version (HTTP $($made.StatusCode)): $($made.Content)"
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: publish the version customers update to
        if: steps.release.outputs.publish == 'yes'
        env:
          # electron-builder's GitHub publisher reads this. It is the token
          # GitHub issues for this workflow run, scoped to this repository and
          # expiring with the job — there is nothing to store, nothing to
          # rotate, and nothing that could reach the package.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          VERSION: ${{ steps.release.outputs.version }}
        # Not a second build: --publish only uploads what dist/installer already
        # holds, including the latest.yml that electron-updater actually reads.
        #
        # THE OUTPUT IS READ, because electron-builder's failure is forty lines
        # of stack trace around one sentence that matters. The first time this
        # happened the only real content was a response header, and the advice
        # printed beside it — "double check that your authentication token is
        # correct" — pointed at the one thing that was fine. Twice.
        shell: pwsh
        run: |
          $log = npx electron-builder --win nsis --config electron-builder.yml --publish always 2>&1 | Tee-Object -Variable out
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $text = ($out | Out-String)
            # MATCHED ON THE ERROR, NOT ON A HEADER THAT IS ALWAYS THERE.
            #
            # This matched 'contents=write', which GitHub prints in
            # x-accepted-github-permissions on EVERY response it refuses —
            # including a 422 about something else entirely. So a race over
            # creating the release was reported to the owner as "your token
            # cannot write", and he was sent to fix a permission that was
            # already correct. Exactly the mistake the comment above this step
            # warns about, made again, one line lower.
            if ($text -match 'Resource not accessible by') {
              throw "The release was refused for want of write access. This build publishes with the token GitHub issues it, so the setting to look at is Settings -> Actions -> General -> Workflow permissions: it must be 'Read and write permissions'. The installer is already uploaded as an artifact."
            }
            if ($text -match '422') {
              throw "GitHub refused something about the release itself (422), not the permission to make it. The release for this version may already exist, or exist half-finished — open https://github.com/$feed/releases, and if v$($env:VERSION) is there WITHOUT latest.yml beside the .exe, delete it and run this build again. A release missing latest.yml is invisible to every installed copy."
            }
            throw "electron-builder could not publish the release. The reason is in the output above."
          }

      # THE ONLY CHECK THAT MATTERS: can an installed copy see this version?
      #
      # A release can exist, look complete on the page, carry the installer —
      # and be invisible to every machine in the world, because the one file
      # electron-updater reads is latest.yml and it is uploaded last. That is
      # exactly what the previous build left behind, and nothing noticed.
      #
      # So the build asks the same question an installed copy asks, the same
      # way, with no credentials, and fails if the answer is not there.
      - name: can an installed copy actually see it?
        if: steps.release.outputs.publish == 'yes'
        shell: pwsh
        run: |
          $v = "${{ steps.release.outputs.version }}"
          $feed = 'stasix12/ANX-'
          $head = @{ 'User-Agent' = 'hapitaron-build'; 'Accept' = 'application/vnd.github+json' }
          $rel = Invoke-WebRequest -Uri "https://api.github.com/repos/$feed/releases/tags/v$v" -Headers ($head + @{ Authorization = "Bearer $env:GITHUB_TOKEN" }) -SkipHttpErrorCheck
          if ($rel.StatusCode -ne 200) { throw "v$v was published and cannot be read back (HTTP $($rel.StatusCode))." }
          $names = ($rel.Content | ConvertFrom-Json).assets | ForEach-Object { $_.name }
          Write-Host "assets on v$v : $($names -join ', ')"
          foreach ($needed in @('latest.yml', "hapitaron-$v-setup.exe")) {
            if ($names -notcontains $needed) {
              throw "v$v is missing $needed. A release without latest.yml is one no installed copy can see — delete it at https://github.com/$feed/releases and run this build again."
            }
          }
          # AND THAT IT IS THE ONE THE FEED HANDS OUT.
          #
          # electron-updater does not ask for a version — it asks GitHub for the
          # LATEST release and reads whatever is there. GitHub orders that by
          # created_at, which it takes from the release's COMMIT date, not from
          # when the upload happened. So a build from an older commit — a
          # revert, a hotfix branched from last week, a manual re-run — can
          # publish perfectly and still leave an older release sitting at
          # /releases/latest. Every customer would go on reading the old one and
          # nothing would look wrong anywhere.
          #
          # Checking the release BY TAG, which the lines above do, cannot catch
          # that: it is the one check that passes precisely when this fails.
          $head2 = Invoke-WebRequest -Uri "https://api.github.com/repos/$feed/releases/latest" -Headers ($head + @{ Authorization = "Bearer $env:GITHUB_TOKEN" }) -SkipHttpErrorCheck
          if ($head2.StatusCode -ne 200) { throw "Published v$v, but the feed has no 'latest' release to hand out (HTTP $($head2.StatusCode))." }
          $serving = ($head2.Content | ConvertFrom-Json).tag_name
          if ($serving -ne "v$v") {
            throw "Published v$v, but the feed still hands out $serving. GitHub picks 'latest' by the release's commit date, so a build from an older commit does not become the one customers read. Nothing was broken — but nobody will receive v$v until a release newer than $serving exists."
          }
          Write-Host "the feed hands out $serving — which is what this build just published."

          Write-Host "v$v is complete: the installer and the file every installed copy reads."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: say where it went
        if: steps.release.outputs.publish == 'yes'
        shell: pwsh
        run: |
          $v = "${{ steps.release.outputs.version }}"
          # THE NUMBER THAT MATTERS TO THE PERSON DOWNLOADING IT, printed by
          # every build. The installer grew to 140 MB without anybody noticing,
          # because nothing ever said how big it was.
          $exe = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 1)
          "### גרסה $v פורסמה" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "גודל ההורדה: $mb MB" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "הורדה ישירה: https://github.com/stasix12/ANX-/releases/download/v$v/hapitaron-$v-setup.exe" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "כל מחשב שכבר מותקנת עליו התוכנה יאסוף אותה לבד תוך כמה שעות, בלי הקישור הזה." >> $env:GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
