# Builds the static export and publishes it to GitHub Pages on every push to
# the default branch.
#
# The site lands on a project sub-path (https://<user>.github.io/ANX-), so the
# build is told about that prefix through NEXT_PUBLIC_BASE_PATH — next.config
# turns it into basePath, and src/lib/site.ts asset() applies it to the plain
# <video> sources next/image cannot cover.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/anx3d-cleaning-shop-ufxo5m]
  # Lets the site be re-published from the Actions tab without a code change.
  workflow_dispatch:
  # Product pages are pre-rendered from Supabase at build time (see
  # generateStaticParams in src/app/products/[slug]/page.tsx) so they load
  # instantly and index well — but that means a brand-new product added from
  # the admin panel needs a rebuild before its own page exists. The homepage
  # catalogue already shows new products immediately (it fetches live), so
  # this schedule is just the backstop that gives new products their own
  # page within the hour even if nobody pushes a code change meanwhile.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and let a finished one complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One-time setup, done by a repository admin rather than here: Settings →
      # Pages → Source: "GitHub Actions". Creating the Pages site through the
      # API is not something the workflow token is allowed to do, so asking it
      # to (configure-pages' `enablement` input) only fails the run.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run typecheck

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # FROM THE SECRETS, NOT FROM A LITERAL — and the literals that used to
          # sit here are the reason this comment is long.
          #
          # They named a project that the live site had long since moved off.
          # Nothing failed, because this workflow publishes to GitHub Pages and
          # nobody opens that copy; the damage was that the two lines READ like
          # the answer to "which database is this product on". The installer's
          # build trusted them, shipped a package pointed at the dead project,
          # and a customer sat in front of a login screen that told him his
          # correct password was wrong. The live answer was only ever in
          # Vercel's own settings, which nothing here can see.
          #
          # The anon key is still public by design — RLS is what restricts
          # access, not secrecy. It lives in the secrets anyway, so that this
          # repository has exactly ONE place stating which database is in use,
          # and that place is the one the installer build also reads.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run export

      # Pages does not run Jekyll behind this workflow, but the marker costs
      # nothing and keeps Next's _next/ directory safe if that ever changes.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
