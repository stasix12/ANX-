# Builds the static export and publishes it to GitHub Pages on every push to
# the default branch.
#
# The site lands on a project sub-path (https://<user>.github.io/ANX-), so the
# build is told about that prefix through NEXT_PUBLIC_BASE_PATH — next.config
# turns it into basePath, and src/lib/site.ts asset() applies it to the plain
# <video> sources next/image cannot cover.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/anx3d-cleaning-shop-ufxo5m]
  # Lets the site be re-published from the Actions tab without a code change.
  workflow_dispatch:
  # Product pages are pre-rendered from Supabase at build time (see
  # generateStaticParams in src/app/products/[slug]/page.tsx) so they load
  # instantly and index well — but that means a brand-new product added from
  # the admin panel needs a rebuild before its own page exists. The homepage
  # catalogue already shows new products immediately (it fetches live), so
  # this schedule is just the backstop that gives new products their own
  # page within the hour even if nobody pushes a code change meanwhile.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and let a finished one complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One-time setup, done by a repository admin rather than here: Settings →
      # Pages → Source: "GitHub Actions". Creating the Pages site through the
      # API is not something the workflow token is allowed to do, so asking it
      # to (configure-pages' `enablement` input) only fails the run.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run typecheck

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # The anon/publishable key is meant to be public — RLS in
          # supabase/schema.sql is what actually restricts access, not
          # keeping this key secret. Safe to keep as a plain workflow value.
          NEXT_PUBLIC_SUPABASE_URL: https://kadiiszpmuboawssdhfy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ibaDG7kFQL9i5Zab6rEjWw_34vE2NQP
        run: npm run export

      # Pages does not run Jekyll behind this workflow, but the marker costs
      # nothing and keeps Next's _next/ directory safe if that ever changes.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
