# Deploys the publishing app by calling Vercel directly, instead of relying on
# Vercel's own GitHub webhook.
#
# Why this exists: that webhook silently skipped commits. On 19/09 two of
# nineteen pushes never appeared in the Vercel deployment list at all — not
# failed, not queued, absent — while every other commit built in about thirty
# seconds. Each time, the fix was to push something else so a later webhook
# carried the earlier work along, which is not something anyone should have to
# notice or do.
#
# A deploy hook is a plain URL that Vercel builds the branch head from. GitHub
# Actions calls it on every push, so a deployment depends on this run rather
# than on a webhook nobody can see or retry.
#
# One-time setup, done once by the repository owner:
#   1. Vercel → the project → Settings → Git → Deploy Hooks. Create one for
#      branch claude/facebook-content-manager-gqtv66 and copy its URL.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions → New
#      repository secret, named VERCEL_DEPLOY_HOOK, holding that URL.
#
# Until the secret exists this workflow does nothing and says so; it never
# fails a push over a setup step that has not happened yet.
name: Deploy publishing app to Vercel

on:
  push:
    branches: [claude/facebook-content-manager-gqtv66]
  # Lets a deployment be forced from the Actions tab with no code change.
  workflow_dispatch:

# A newer commit supersedes an older one, so cancel a run still waiting.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to build this branch
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -u
          if [ -z "${HOOK}" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set — nothing to call."
            echo "Add it under Settings → Secrets and variables → Actions to turn this on."
            exit 0
          fi
          status=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' -X POST "${HOOK}")
          echo "Vercel answered HTTP ${status}"
          cat response.json || true
          echo
          case "${status}" in
            2??) echo "Deployment requested." ;;
            *) echo "The deploy hook was rejected. Check that the secret still matches the hook in Vercel."; exit 1 ;;
          esac

      # WHY THIS STEP EXISTS.
      #
      # The hook returns 201 and {"state":"PENDING"} the moment Vercel accepts
      # the request. It says nothing about whether the build then succeeded, so
      # this job went green for e33f49c and 290907c while production stayed on
      # 5a11493 — the owner reloaded, saw the old screen, and had no way to
      # tell a fix that did not ship from a fix that did not work. That is the
      # same class of silence /api/version was added to end, one layer up.
      #
      # So: ask production what it is running until it says the commit we just
      # pushed. A build that never lands now fails the job loudly instead of
      # reporting success.
      - name: Wait for production to report this commit
        env:
          SITE: ${{ vars.PRODUCTION_URL || 'https://anx-ggyo.vercel.app' }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -u
          short="${EXPECTED:0:7}"
          echo "Waiting for ${SITE} to report build ${short}"
          live=''
          # 30 x 20s = 10 minutes. A normal build lands in well under two.
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 15 "${SITE}/api/version" || true)
            live=$(printf '%s' "${body}" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p')
            echo "attempt ${i}: production reports '${live}'"
            if [ "${live}" = "${short}" ]; then
              echo "Production is on ${short}."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Production is still on '${live}' after 10 minutes, not '${short}'. The deploy hook was accepted but the build did not reach production — open the Vercel dashboard, find the newest deployment for this branch and read why it failed."
          exit 1
