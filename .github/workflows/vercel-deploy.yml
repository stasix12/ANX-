# Deploys the publishing app by calling Vercel directly, instead of relying on
# Vercel's own GitHub webhook.
#
# Why this exists: that webhook silently skipped commits. On 19/09 two of
# nineteen pushes never appeared in the Vercel deployment list at all — not
# failed, not queued, absent — while every other commit built in about thirty
# seconds. Each time, the fix was to push something else so a later webhook
# carried the earlier work along, which is not something anyone should have to
# notice or do.
#
# A deploy hook is a plain URL that Vercel builds the branch head from. GitHub
# Actions calls it on every push, so a deployment depends on this run rather
# than on a webhook nobody can see or retry.
#
# One-time setup, done once by the repository owner:
#   1. Vercel → the project → Settings → Git → Deploy Hooks. Create one for
#      branch claude/facebook-content-manager-gqtv66 and copy its URL.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions → New
#      repository secret, named VERCEL_DEPLOY_HOOK, holding that URL.
#
# Until the secret exists this workflow does nothing and says so; it never
# fails a push over a setup step that has not happened yet.
name: Deploy publishing app to Vercel

on:
  push:
    branches: [claude/facebook-content-manager-gqtv66]
  # Lets a deployment be forced from the Actions tab with no code change.
  workflow_dispatch:

# A newer commit supersedes an older one, so cancel a run still waiting.
#
# AND THAT NOW BITES HARDER THAN IT USED TO. The wait below grew from ten
# minutes to three rounds of ten, so a second push inside half an hour cancels
# the first run before it can confirm anything — which is how four deploys in a
# row ended "cancelled" and the owner was left looking at an old build while
# every one of them was reported as pushed.
#
# Cancelling is still right: the newer commit contains the older one, and two
# runs polling the same production URL for different commits can only disagree.
# What it means in practice is that only the LAST push of a burst gets a
# confirmation — so a burst has to end before the answer is worth anything.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to build this branch, and keep asking until it lands
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          SITE: ${{ vars.PRODUCTION_URL || 'https://anx-ggyo.vercel.app' }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -u
          if [ -z "${HOOK}" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set — nothing to call."
            echo "Add it under Settings → Secrets and variables → Actions to turn this on."
            exit 0
          fi
          short="${EXPECTED:0:7}"

          # WHY THIS ASKS MORE THAN ONCE.
          #
          # Roughly half the hook calls produced no deployment at all. Vercel
          # answered 201 {"state":"PENDING"} every time and then production
          # stayed on the previous build for the full ten minutes — not a slow
          # build: the ones that DO land are served in under a minute. Measured
          # over one evening: eight calls, four of which never reached
          # production, alternating with no change to the code in between.
          #
          # The cause is on Vercel's side and is not visible from here — the
          # likeliest is this repository having BOTH the Git integration and
          # this hook attached, so two deployments race for the same commit and
          # one is dropped as a duplicate. That is a setting in somebody's
          # dashboard, and until it is found, a fix that reached GitHub and not
          # the owner's phone is the thing that actually costs him.
          #
          # So: ask, wait, and if production has not moved, ask again. A second
          # request after the first has gone quiet is not a retry storm — it is
          # at most three hook calls, ten minutes apart, for one push.
          ask() {
            status=$(curl -sS --max-time 30 -o response.json -w '%{http_code}' -X POST "${HOOK}")
            echo "Vercel answered HTTP ${status}"
            cat response.json || true
            echo
            case "${status}" in
              2??) echo "Deployment requested." ;;
              *) echo "::error::The deploy hook was rejected (HTTP ${status}). Check that the secret still matches the hook in Vercel."; exit 1 ;;
            esac
          }

          live=''
          for round in 1 2 3; do
            ask
            echo "Round ${round}: waiting for ${SITE} to report build ${short}"
            # 30 x 20s = 10 minutes. A build that lands at all lands in under one.
            for i in $(seq 1 30); do
              body=$(curl -sS --max-time 15 "${SITE}/api/version" || true)
              live=$(printf '%s' "${body}" | sed -n 's/.*"build":"\([^"]*\)".*/\1/p')
              if [ "${live}" = "${short}" ]; then
                echo "Production is on ${short} (round ${round}, attempt ${i})."
                exit 0
              fi
              [ $((i % 5)) -eq 0 ] && echo "  attempt ${i}: production reports '${live}'"
              sleep 20
            done
            echo "::warning::Round ${round} ended with production still on '${live}'. Asking Vercel again."
          done

          echo "::error::Production is still on '${live}' after three requests and thirty minutes, not '${short}'. Open the Vercel dashboard, find the newest deployment for this branch and read why it failed — and check whether the Git integration AND this deploy hook are both attached to the project, which makes two deployments race for every commit."
          exit 1
