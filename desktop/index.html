<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
<title>הפתרון המבריק</title>
<style>
  /* Deliberately one file with no fonts, no framework and no network. This
     window must open on a machine with no internet and still be readable. */
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --warn: #d29922; --err: #f85149; --you: #a371f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .state { color: var(--dim); font-size: 13px; }
  .grow { flex: 1; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #log {
    flex: 1; overflow-y: auto; padding: 14px 18px; margin: 0;
    /* Left-to-right: these lines are a mix of Hebrew sentences and English
       identifiers, and a mixed line reads correctly only one way round. */
    direction: ltr; text-align: left;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  #log div { padding: 1px 0; }
  .err { color: var(--err); }
  .sys { color: var(--dim); }
  .prompt { color: var(--accent); }
  .you { color: var(--you); }
  footer { border-top: 1px solid var(--line); padding: 12px 18px; }
  .ask { color: var(--accent); margin-bottom: 8px; direction: rtl; text-align: right; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 8px 12px; font: inherit; direction: ltr; text-align: left;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--dim); font-size: 12px; padding: 0 18px 12px; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>הפתרון המבריק — פרסום</h1>
    <span class="state" id="state">מתחיל…</span>
    <span class="grow"></span>
    <button id="site">הדשבורד באתר</button>
    <button id="restart">הפעל מחדש</button>
  </header>

  <div id="log"></div>

  <p class="hint" id="hint">
    אפשר לסגור את החלון — התוכנה ממשיכה לפרסם ברקע. הסמל נשאר ליד השעון.
  </p>

  <footer id="answerbar" hidden>
    <div class="ask" id="ask"></div>
    <form id="form">
      <input id="answer" autocomplete="off" autofocus />
      <button type="submit">שלח</button>
    </form>
  </footer>

<script>
  const log = document.getElementById('log');
  const dot = document.getElementById('dot');
  const state = document.getElementById('state');
  const bar = document.getElementById('answerbar');
  const ask = document.getElementById('ask');
  const input = document.getElementById('answer');

  function add(entry) {
    /* At the bottom only if the reader is already there — scrolling away to
       read an error must not be undone by the next heartbeat line. */
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const div = document.createElement('div');
    div.className = entry.kind;
    div.textContent = entry.line;
    log.appendChild(div);
    while (log.childElementCount > 500) log.removeChild(log.firstChild);
    if (atBottom) log.scrollTop = log.scrollHeight;

    if (entry.kind === 'prompt') {
      ask.textContent = entry.line.trim();
      bar.hidden = false;
      input.value = '';
      input.focus();
    }
  }

  window.worker.onHistory((lines) => { log.textContent = ''; lines.forEach(add); });
  window.worker.onLine(add);
  window.worker.onState((s) => {
    dot.classList.toggle('on', !!s.running);
    state.textContent = s.running ? 'פועל' : 'עצור';
  });

  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value;
    if (!text.trim()) return;
    window.worker.answer(text);
    bar.hidden = true;
    input.value = '';
  });
  document.getElementById('site').addEventListener('click', () => window.worker.openSite());
  document.getElementById('restart').addEventListener('click', () => window.worker.restart());
</script>
</body>
</html>
