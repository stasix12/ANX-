# Turns dist/app into something a person downloads and double-clicks.
#
# `directories.app` points at the folder scripts/build-app.mjs assembles, so
# this file never sees the repository: no src/, no worker/*.ts, no .env.local,
# no node_modules of the website. What is not in dist/app cannot be shipped by
# accident, which is the property worth having.
appId: com.hapitaron.social
productName: HaPitaron
copyright: הפתרון המבריק

directories:
  app: dist/app
  output: dist/installer

# Chromium is NOT bundled. The worker drives the Chrome the customer already
# has (playwright-core with channel 'chrome'), which is the difference between
# a download of tens of megabytes and one of several hundred.
# WHAT GOES IN — AND THE FIFTY MEGABYTES THAT WENT IN WITHOUT BEING ASKED.
#
# The header above says this file never sees the repository, and about
# directories.app that is true. It is NOT true of node_modules: electron-builder
# collects production dependencies from the PROJECT root — this repository —
# and dist/app/package.json declaring none does not stop it. Measured on the
# released 3.55.0 installer, 48 of its 132 MB were the WEBSITE's build tools:
#
#   23.4 MB  @next/swc-win32-x64-msvc   (the Next.js Rust compiler, 106 MB raw)
#   16.5 MB  next                       (4,878 files)
#    5.9 MB  @img/sharp-win32-x64       (libvips, for resizing images on a server)
#    1.7 MB  playwright-core            ← the only one this program uses
#
# None of it is reachable from main.cjs or worker.cjs: both are esbuild bundles
# and the only runtime require() either makes into node_modules is
# playwright-core. A customer on a home connection was downloading a Rust
# compiler for a website that runs on Vercel.
#
# So node_modules is excluded and exactly one package invited back. The order
# matters — a later pattern wins — and the negation has to come before the
# re-inclusion.
files:
  - '**/*'
  - '!**/*.map'
  - '!probe.cjs'
  - '!node_modules/**/*'
  - 'node_modules/playwright-core/**/*'

# OUT OF THE ARCHIVE, because a child process cannot read from one.
#
# Everything else is packed into app.asar, which Electron's own fs can see
# through. The operating system cannot: `spawn` on a script inside the archive,
# or with a working directory inside it, fails with ENOENT — reported against
# the executable's name, so the error blames HaPitaron.exe for a file that is
# not missing at all. That is exactly what the first installed build did.
asarUnpack:
  - worker.cjs
  - node_modules/**

# WHERE THE INSTALLED APP LOOKS FOR ITS NEXT VERSION.
#
# This block is what bakes resources/app-update.yml into the package, and that
# file is the only thing the installed copy knows about updates. Without it
# electron-updater has no feed and the app says so on its עדכונים screen
# rather than claiming to be current.
#
# THE ONE PROPERTY THAT MATTERS IS THAT IT IS PUBLIC. A private repository's
# release assets need a token to download, so pointing the updater at one would
# mean shipping a credential inside every customer's installer — exactly what
# worker/test/package.test.ts exists to make impossible.
#
# IT USED TO BE A SEPARATE REPOSITORY, and the reason written here was that the
# source is private. The source is not private: stasix12/ANX- is public, and has
# been throughout. So the separate feed bought nothing and cost the one thing
# that mattered — it could only be published to with a hand-made token, that
# token was issued read-only, and for days every build ended with a green
# installer that no installed copy could ever see. A feature nobody can turn on
# is not a feature.
#
# Publishing to the repository the build already runs in needs no token at all:
# GitHub hands every workflow one, scoped to that repository, that cannot leak
# and cannot be misconfigured. Nothing extra is exposed — the source is already
# public, and a release adds a version number and a file that anybody sent a
# download link already had.
#
# IF THE SOURCE IS EVER MADE PRIVATE, this becomes the trap the old comment was
# afraid of: installed copies would go on asking a repository they can no longer
# read, silently. build-app.yml therefore asks GitHub — anonymously, exactly as
# an installed copy asks — and REFUSES to publish when the answer is not public.
# Then it is a loud build failure with instructions, rather than a hundred
# machines quietly stuck on an old version.
#
# Kept identical to the places .github/workflows/build-app.yml names it, and
# worker/test/updates.test.ts fails the build if they ever drift apart.
publish:
  provider: github
  owner: stasix12
  repo: ANX-
  # Live immediately rather than as a draft: a draft is invisible to the
  # updater, so a release nobody remembers to un-draft is a release that
  # silently never reaches anybody.
  releaseType: release

# HOW BIG THE DOWNLOAD IS, WHICH IS THE CUSTOMER'S PROBLEM AND NOT ELECTRON'S.
#
# The app's own code is 11 MB — the bundle, the window and playwright-core. The
# other hundred and thirty are Chromium, which Electron carries and which no
# setting here can remove. So the three things below are what is actually
# available, and they were all left at their defaults.
#
# Asked for, and its effect is NOT established. electron-builder overrides the
# compression of the inner archive for any differential-aware NSIS target (it
# pins a 1 MB dictionary and non-solid blocks, which is exactly what makes a
# 1 MB update possible instead of a 133 MB one), so on Windows this may be doing
# nothing at all. Kept because it is honoured for the Linux AppImage and costs
# only build time — but the measured saving between 3.53.0 and 3.55.0 came from
# the locales below and the trimmed playwright-core, not from here. Claiming
# otherwise, as this comment first did, is the kind of thing that sends the next
# person looking in the wrong place.
compression: maximum

# EVERY LANGUAGE CHROMIUM SPEAKS, WHICH IS FIFTY-FIVE OF THEM.
#
# Electron ships a .pak per locale for its own dialogs and menus — the
# right-click menu, the file picker, the spell-check UI. All of ours are Hebrew
# and written by us; the only two that can ever be READ here are Hebrew and the
# English fallback Chromium requires.
#
# AND IT DOES WORK ON WINDOWS. I wrote here that it was ignored, added a hook to
# do the job by hand, and only then opened the published installer: it contains
# exactly he.pak and en-US.pak, and has since the build before the hook existed.
# The setting was working the whole time. What the hook actually reports on
# Windows is "removed 0". It stays as a belt — one line, and it is what would
# catch this if a future electron-builder stopped honouring the setting — but
# the credit for those megabytes belongs here.
electronLanguages:
  - he
  - en-US

afterPack: scripts/after-pack.cjs

win:
  # NSIS ONLY. The zip was a second copy of the same program — 190 MB beside a
  # 140 MB installer — that nothing downloads and the updater never reads: an
  # installed copy follows latest.yml to the .exe. It cost every build minutes
  # and the release page a file that could only confuse whoever landed there.
  target:
    - target: nsis
      arch: [x64]
  artifactName: hapitaron-${version}-setup.${ext}

nsis:
  # One click, no questions, into the user's own folder — no administrator
  # prompt, because asking a customer to approve an unsigned program to make
  # machine-wide changes is asking them to say no.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: הפתרון המבריק
  deleteAppDataOnUninstall: false

linux:
  target: [AppImage]
  category: Utility
  artifactName: hapitaron-${version}.${ext}
