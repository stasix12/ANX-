<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="מכונת ניקוי מקצועית — מציין מיקום">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c2d3df" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#23568b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#23568b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g transform="translate(700 230)">
    <!-- body: a pale panel with aqua linework, like a technical schematic -->
    <rect x="0" y="120" width="420" height="420" rx="38" fill="#ffffff" stroke="#23568b" stroke-width="6"/>
    <rect x="42" y="176" width="336" height="150" rx="18" fill="#eef2f5" stroke="#c2d3df" stroke-width="3"/>
    <rect x="70" y="206" width="180" height="16" rx="8" fill="#23568b"/>
    <rect x="70" y="240" width="120" height="12" rx="6" fill="#56a3cf"/>
    <rect x="70" y="272" width="240" height="12" rx="6" fill="#56a3cf"/>
    <!-- control dials -->
    <circle cx="130" cy="410" r="42" fill="none" stroke="#23568b" stroke-width="6"/>
    <circle cx="130" cy="410" r="11" fill="#23568b"/>
    <circle cx="250" cy="410" r="42" fill="none" stroke="#56a3cf" stroke-width="6"/>
    <circle cx="250" cy="410" r="11" fill="#56a3cf"/>
    <rect x="308" y="382" width="70" height="56" rx="12" fill="#23568b" fill-opacity="0.16" stroke="#23568b" stroke-width="3"/>
    <!-- handle -->
    <path d="M60 120V56a44 44 0 0144-44h212a44 44 0 0144 44v64" fill="none" stroke="#23568b" stroke-width="16" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="80" cy="566" r="40" fill="#ffffff" stroke="#56a3cf" stroke-width="7"/>
    <circle cx="340" cy="566" r="40" fill="#ffffff" stroke="#56a3cf" stroke-width="7"/>
    <!-- hose leaving the machine -->
    <path d="M420 300c150 0 190 90 300 90s150-70 260-40"
          fill="none" stroke="#23568b" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55"
          stroke-dasharray="34 22"/>
  </g>

  <path d="M72 168V72h96" fill="none" stroke="#23568b" stroke-width="4" stroke-linecap="square"/>
  <path d="M1752 72h96v96" fill="none" stroke="#23568b" stroke-width="4" stroke-linecap="square"/>
  <path d="M1848 912v96h-96" fill="none" stroke="#23568b" stroke-width="4" stroke-linecap="square"/>
  <path d="M168 1008H72v-96" fill="none" stroke="#23568b" stroke-width="4" stroke-linecap="square"/>
  <text x="380" y="900" text-anchor="middle" direction="rtl"
        font-family="Heebo, Arial, sans-serif" font-size="42" font-weight="700" fill="#16232e">מכונת ניקוי מקצועית</text>
  <text x="380" y="956" text-anchor="middle" direction="rtl"
        font-family="Heebo, Arial, sans-serif" font-size="26" fill="#55708a">מציין מיקום — להחלפה בתמונה אמיתית</text>
</svg>
