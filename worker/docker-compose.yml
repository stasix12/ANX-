# One customer, one container, one volume.
#
# Run from the repository root:
#   docker compose -f worker/docker-compose.yml up -d
#
# To add a second customer, copy the block and change three things: the service
# name, the volume, and SOCIAL_WORKER_NAME. Nothing else is shared — two
# customers never see each other's Facebook session, because a session is a
# directory and each gets its own.
services:
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    # A browser needs more shared memory than Docker's 64MB default. Chromium
    # crashes with "Target closed" partway through an upload without this, and
    # the failure looks like Facebook rejecting the post.
    shm_size: 1gb
    env_file:
      - ../.env.local
    environment:
      # The name this worker registers under on the dashboard. One per customer.
      SOCIAL_WORKER_NAME: worker@cloud
      # Set these only if the datacenter address turns out to be the problem —
      # see docs/CLOUD-WORKER.md, "אם פייסבוק מבקשת אימות".
      # SOCIAL_BROWSER_PROXY: http://proxy.example.com:8080
      # SOCIAL_BROWSER_PROXY_USER: ''
      # SOCIAL_BROWSER_PROXY_PASS: ''
    volumes:
      - fb-profile:/data

volumes:
  fb-profile:
