<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>באר שבע ביחד | Facebook</title>
<style>
  body{font-family:sans-serif;background:#f0f2f5;margin:0}
  header{background:#fff;padding:12px 20px;border-bottom:1px solid #ddd}
  main{max-width:680px;margin:20px auto}
  .box{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .trigger{display:block;width:100%;text-align:right;border:0;background:#f0f2f5;border-radius:20px;padding:10px 14px;color:#65676b;font-size:16px;cursor:pointer}
  [role=dialog]{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
  .panel{background:#fff;width:500px;border-radius:8px;padding:16px}
  [contenteditable]{min-height:120px;font-size:18px;outline:none}
  .preview img{width:80px;height:80px;object-fit:cover;margin:4px;border-radius:6px}
  button.post[aria-disabled=true]{opacity:.4}
  .feed p{white-space:pre-wrap}
</style></head>
<body>
<header><strong>Facebook (mock)</strong> · <span id="user">שלום, סטס</span></header>
<main>
  <div class="box">
    <h1>באר שבע ביחד</h1>
    <p>קבוצה ציבורית · 12K חברים</p>
  </div>
  <div class="box" role="main">
    <button class="trigger" id="trigger" type="button">כתבו משהו…</button>
  </div>
  <div class="box feed" id="feed">
    <h2>פוסטים</h2>
    <!--
      A DECOY, and it is the whole point of this fixture's feed.

      Facebook renders every post as role="article" and so does every comment.
      A comment box found by "the first one on the page" would land the owner's
      phone number under somebody else's post, in a group they need to stay
      welcome in. This article sits FIRST in the DOM and has its own comment
      box, so any anchoring that is not tied to our own text fails loudly here
      instead of quietly in production.
    -->
    <div role="article" id="decoy">
      <p>פוסט של שכן מהשכונה על חתול שאבד ליד הפארק</p>
      <button type="button" aria-label="הוספת תגובה">תגובה</button>
      <div class="comments"></div>
    </div>
  </div>
</main>
<script>
  const feed = document.getElementById('feed');
  // Persist posts like a real feed would survive a reload.
  const saved = JSON.parse(localStorage.getItem('mockFeed') || '[]');

  /* A post the way Facebook builds one: an article, a comment button that
     REVEALS the box rather than showing it, and Enter to submit. */
  function addArticle(text) {
    const art = document.createElement('div');
    art.setAttribute('role', 'article');
    const body = document.createElement('p');
    /*
      EMOJI BECOME IMAGES, exactly as Facebook does it.

      This is not decoration in a fixture: it is the bug. Facebook swaps emoji
      in post text for <img> elements, so the post's textContent has a HOLE
      where the emoji was. Code that looks for the first line of a post as it
      was WRITTEN — "ניקוי ספות 🧽" — is looking for a string the page does not
      contain, and reports a post that is plainly on screen as missing.

      Every one of the owner's posts opens with an emoji, so every lookup
      failed, and the screen said "לא מצאנו את הפוסט הזה בקבוצה" about 117
      posts that were all exactly where they should be.
    */
    for (const piece of text.split(/([\p{Extended_Pictographic}\uFE0F\u200D]+)/u)) {
      if (!piece) continue;
      if (/^[\p{Extended_Pictographic}\uFE0F\u200D]+$/u.test(piece)) {
        const img = document.createElement('img');
        img.alt = piece;
        img.src =
          'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
        img.width = 16;
        img.height = 16;
        body.appendChild(img);
      } else {
        body.appendChild(document.createTextNode(piece));
      }
    }
    art.appendChild(body);
    /* A post's own address, on its timestamp, exactly as Facebook puts it —
       this is what the address book reads once and keeps, so nothing has to
       hunt the group for the post's words ever again. */
    const stamp = document.createElement('a');
    stamp.href = `https://www.facebook.com/groups/1234567890/posts/${Date.now()}${feed.children.length}/?__cft__=tracking`;
    stamp.textContent = 'לפני שעה';
    art.appendChild(stamp);
    const open = document.createElement('button');
    open.type = 'button';
    open.setAttribute('aria-label', 'הוספת תגובה');
    open.textContent = 'תגובה';
    const list = document.createElement('div');
    list.className = 'comments';
    open.addEventListener('click', () => {
      if (art.querySelector('[role=textbox]')) return;
      const box = document.createElement('div');
      box.setAttribute('role', 'textbox');
      box.setAttribute('contenteditable', 'true');
      box.setAttribute('aria-label', 'כתיבת תגובה');
      box.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.shiftKey) return;
        e.preventDefault();
        const c = document.createElement('p');
        c.className = 'comment';
        c.textContent = box.innerText;
        list.appendChild(c);
        box.innerText = '';
      });
      art.insertBefore(box, list);
    });
    art.appendChild(open);
    art.appendChild(list);
    feed.appendChild(art);
  }

  /*
    A FEED THAT HAS TO BE SCROLLED, and that does NOT scroll the window.

    Facebook's group feed frequently scrolls an inner container while
    window.scrollY sits at 0. The search used to stop the moment scrollY
    stopped changing, which on such a page is after two passes — so a post a
    few screens down was reported as missing while it was plainly there.

    These fillers push our post below the fold inside a scrollable box, so any
    give-up rule based on pixels fails here instead of on the owner's machine.
  */
  const FILLERS = 25;
  for (let i = 0; i < FILLERS; i += 1) addArticle(`פוסט של שכן מספר ${i + 1} על משהו אחר לגמרי בשכונה`);
  for (const t of saved) addArticle(t);
  feed.style.maxHeight = '600px';
  feed.style.overflowY = 'auto';
  const decoyBtn = document.querySelector('#decoy button');
  const decoyList = document.querySelector('#decoy .comments');
  decoyBtn.addEventListener('click', () => {
    if (document.querySelector('#decoy [role=textbox]')) return;
    const box = document.createElement('div');
    box.setAttribute('role', 'textbox');
    box.setAttribute('contenteditable', 'true');
    box.setAttribute('aria-label', 'כתיבת תגובה');
    box.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.shiftKey) return;
      e.preventDefault();
      const c = document.createElement('p');
      c.className = 'comment';
      c.textContent = box.innerText;
      decoyList.appendChild(c);
      box.innerText = '';
    });
    document.querySelector('#decoy').insertBefore(box, decoyList);
  });
  document.getElementById('trigger').addEventListener('click', () => {
    if (document.querySelector('[role=dialog]')) return;
    const dlg = document.createElement('div');
    dlg.setAttribute('role', 'dialog');
    dlg.setAttribute('aria-label', 'יצירת פוסט');
    dlg.innerHTML = `
      <div class="panel">
        <h2>יצירת פוסט</h2>
        <div role="textbox" contenteditable="true" aria-label="כתבו משהו…" id="editor"></div>
        <div class="preview" id="preview"></div>
        <div style="margin:10px 0">
          <button type="button" aria-label="תמונה/סרטון" id="photo">📷 תמונה/סרטון</button>
          <input type="file" id="file" accept="image/*,video/*" multiple hidden>
        </div>
        <button type="button" class="post" id="post" aria-disabled="true">פרסום</button>
      </div>`;
    document.body.appendChild(dlg);
    const editor = dlg.querySelector('#editor');
    const post = dlg.querySelector('#post');
    const file = dlg.querySelector('#file');
    const preview = dlg.querySelector('#preview');
    const refresh = () => post.setAttribute('aria-disabled', editor.innerText.trim() || preview.children.length ? 'false' : 'true');
    editor.addEventListener('input', refresh);
    dlg.querySelector('#photo').addEventListener('click', () => file.click());
    file.addEventListener('change', () => {
      // simulate a slow upload with a progress bar
      const bar = document.createElement('div');
      bar.setAttribute('role', 'progressbar');
      bar.textContent = 'מעלה…';
      preview.appendChild(bar);
      setTimeout(() => {
        bar.remove();
        for (const f of file.files) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(f);
          preview.appendChild(img);
        }
        refresh();
      }, 1500);
    });
    post.addEventListener('click', () => {
      if (post.getAttribute('aria-disabled') === 'true') return;
      const text = editor.innerText;
      const count = preview.querySelectorAll('img').length;
      window.__published = { text, images: count };
      setTimeout(() => {
        dlg.remove();
        const line = text + (count ? ` [${count} תמונות]` : '');
        addArticle(line);
        saved.push(line);
        localStorage.setItem('mockFeed', JSON.stringify(saved));
      }, 800);
    });
  });
</script>
</body></html>
