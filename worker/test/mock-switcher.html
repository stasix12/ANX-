<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>mock — Facebook account menu</title>
<!--
  THE MENU profiles.ts READS, rebuilt from the customer's own screenshot.

  It is not a copy of Facebook's markup — nobody has that — it is a copy of the
  SHAPES that make the read hard, and every one of them is here because getting
  it wrong produces a specific, nasty bug:

    * THE ROWS CARRY NO LINK, NO ID AND NO CLASS. Only a role, an image and a
      name. A reader that needs an href finds nothing at all.

    * THE MENU'S OWN ITEMS LOOK EXACTLY LIKE PROFILES — same role, same
      nesting, same single line of text. Only their words tell them apart, and
      "התנתקות" offered as somebody to publish as is the failure that matters.

    * EVERY ROW IS NESTED two levels deep, so a reader that collects ancestors
      as well as rows finds "profiles" whose name is the whole menu.

    * THE ANCHOR HAS ITS OWN WRAPPERS, which precede the rows' wrappers in
      document order. Those wrappers CONTAIN the anchor, which is why the
      reader skips containers of it rather than trusting position alone.

    * THE MENU STARTS CLOSED, behind a banner button labelled the way Facebook
      labels it, because opening it is half of what can fail.

    * EACH ROW CARRIES ITS OWN PICTURE, at the size Facebook draws an avatar,
      and a different colour per row. That is what lets the suite prove the
      camera photographed THIS row rather than the first one it found: three
      identical placeholders would pass whatever it pointed at. One row's
      picture is a 1px tracking pixel instead, because these rows really do
      contain those, and a smudge uploaded as somebody's business logo is the
      failure that shape produces.

  The two names are the customer's real ones. They are on his screen every day
  and they are the point of the feature: one account, a personal profile and a
  business one.
-->
<body>
  <!--
    FACEBOOK'S LEFT-HAND NAVIGATION, always on the page and always visible.

    This is not scenery. MENU_SELECTOR used to include role="navigation", so
    "is a menu already open?" answered yes the instant any Facebook page
    loaded: the avatar was never clicked, this landmark was read instead of the
    account menu, and the perfectly honest answer that came back — "no profile
    list here" — was about the side bar.

    The owner pressed the button, the machine did everything right, and the
    screen said his account has no second profile. Nothing looked broken.
  -->
  <!--
    ANOTHER DIALOG, ALWAYS OPEN, AND FIRST IN THE DOCUMENT.

    Facebook's home page is never just the page: a notifications popover, a chat
    window, something left over from the last interaction. They answer to
    role="dialog" exactly like the account menu does, and they come BEFORE it.

    The reader used to take whatever `waitForSelector` handed back — the first
    match in document order — ask that one whether it was the account menu, get
    "no", press Escape and try the next button. Every attempt therefore examined
    this same wrong element, and the answer was always "לא הצלחנו לפתוח את תפריט
    החשבון" while the real menu sat open beside it, unread. It is the failure the
    owner photographed three times.
  -->
  <div role="dialog" id="decoy">
    <span>התראות</span>
    <span>אין התראות חדשות</span>
  </div>

  <div role="navigation">
    <div role="button"><span>בית</span></div>
    <div role="button"><span>חברים</span></div>
    <div role="button"><span>קבוצות</span></div>
  </div>

  <div role="banner">
    <div role="button" aria-label="חיפוש">🔍</div>
    <div role="button" aria-label="החשבון שלך" id="avatar" onclick="document.getElementById('menu').hidden = false">
      <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="">
    </div>
  </div>

  <div role="menu" id="menu" hidden>
    <div>
      <div>
        <div role="button" data-row="dor" onclick="window.__picked = 'Dor Moyal'">
          <!-- A 1px image BEFORE the avatar, which is the ordinary state of
               Facebook's markup. A camera that takes the first <img> it finds
               in the row uploads this — a one-pixel smudge — as the owner's
               face, and on screen that is a grey dot nobody can explain. -->
          <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" style="width:1px;height:1px">
          <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGO4o6EBAAMQAS0ujiXaAAAAAElFTkSuQmCC" alt="" style="width:36px;height:36px;image-rendering:pixelated">
          <span>Dor Moyal</span>
        </div>
      </div>
      <div>
        <div role="button" data-row="air" onclick="window.__picked = 'Air Master'">
          <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGPQCLgDAAH4AVXSujU3AAAAAElFTkSuQmCC" alt="" style="width:36px;height:36px;image-rendering:pixelated">
          <span>Air Master</span>
        </div>
      </div>
      <!--
        A PAGE, WHICH IS DRAWN AS TWO LINES: the name, and "דף" under it.

        The row filter rejected any text containing a newline — a guard against
        a container that had swallowed its children — and that quietly threw
        away every Page there is. The owner's own account holds two of them and
        no additional profiles at all, so for him the feature returned an empty
        list that was, line by line, working exactly as written.
      -->
      <!-- The label on its OWN line, which is how the menu draws it. -->
      <div>
        <div role="button" data-row="page1" onclick="window.__picked = 'הפתרון המבריק'">
          <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGOQWxAFAAH4ARkK9rG6AAAAAElFTkSuQmCC" alt="" style="width:36px;height:36px;image-rendering:pixelated">
          <span style="display:block">הפתרון המבריק</span>
          <span style="display:block">דף</span>
        </div>
      </div>
      <!-- And the same thing INLINE, because whether those two sit on one line
           or two is a single CSS value that belongs to Facebook and changes
           without notice. Both shapes are real; both must yield the name. -->
      <div>
        <!-- AND A ROW WHOSE ONLY IMAGE IS A TRACKING PIXEL. It must come back
             with NO picture: an initial in a circle is honest, a 1px smear
             presented as a business logo is not. -->
        <div role="button" data-row="page2" onclick="window.__picked = 'FreshWave'">
          <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" style="width:1px;height:1px">
          <span>FreshWave – ניקוי עמוק למזגנים</span>
          <span>דף</span>
        </div>
      </div>
      <!--
        ABOVE THE ANCHOR AND NOT A PROFILE — the one shape that the word list
        in selectors.ts is the only defence against.

        Everything below "הצגת כל הפרופילים" is already excluded by position,
        so without a row like this one the filter is never exercised and the
        test passes whether it exists or not. It was: deleting the filter
        entirely left this suite green, which is how it got added here.

        Facebook really does offer this row, right beside the anchor, and it is
        exactly the sort of thing a person must never be offered as somebody to
        publish as.
      -->
      <div>
        <div role="button" data-row="create" onclick="window.__picked = 'create'">
          <span>יצירת פרופיל חדש</span>
        </div>
      </div>
      <div>
        <div role="button" data-row="all" onclick="window.__picked = 'ALL'">
          <span>הצגת כל הפרופילים</span>
        </div>
      </div>
    </div>

    <div>
      <div role="button" onclick="window.__picked = 'settings'"><span>הגדרות ופרטיות</span></div>
      <div role="button" onclick="window.__picked = 'help'"><span>עזרה ותמיכה</span></div>
      <div role="button" onclick="window.__picked = 'report'"><span>דיווח על בעיה</span></div>
      <div role="button" onclick="window.__picked = 'display'"><span>תצוגה ונגישות</span></div>
      <div role="button" onclick="window.__picked = 'logout'"><span>התנתקות</span></div>
    </div>
  </div>

  <script>
    /*
      THE TOP BAR THAT FILLS IN LATE — loaded with #late.

      This is the owner's own failure, reproduced. Facebook ships the banner
      element with the page and puts the buttons in it when its app renders, so
      a reader that looks for the avatar the instant the HTML arrives finds an
      empty bar. It never used to matter, because the caller spent a blind 2.5
      seconds first; the moment that pause was removed for speed, "we could not
      open the account menu" came back instantly on an account where the menu
      was perfectly fine.

      A retry is only a retry if it looks again: the candidates have to be
      re-read each round, and the wait has to be for a control rather than for a
      clock.
    */
    /*
      AND PRESSING A PROFILE ROW TAKES THE MENU WITH IT.

      Facebook reloads into the other identity when one of these is pressed, so
      the menu — and every picture in it — is gone the instant the click lands.
      A reader that photographs the rows AFTER pressing one is photographing a
      page that no longer exists, and on this fixture that would have passed
      quietly unless the fixture behaved the same way.
    */
    for (const row of document.querySelectorAll('[data-row="dor"], [data-row="air"], [data-row="page1"], [data-row="page2"]')) {
      row.addEventListener('click', () => {
        const menu = document.getElementById('menu');
        if (menu) menu.remove();
      });
    }

    /*
      A MENU THAT IS VISIBLE BEFORE IT IS FULL — loaded with #slowmenu.

      Facebook mounts the container and fills it a moment later, so an identity
      test run on the instant the menu appears reads an empty box and throws a
      perfectly good menu away. Same mistake as reading the top bar before it had
      any buttons in it, one layer further in.
    */
    if (location.hash === '#slowmenu') {
      const menu = document.getElementById('menu');
      const kept = Array.from(menu.children);
      for (const node of kept) node.remove();
      const fill = () => setTimeout(() => { for (const node of kept) menu.appendChild(node); }, 900);
      document.getElementById('avatar').addEventListener('click', fill);
    }

    if (location.hash === '#late') {
      const bar = document.querySelector('div[role="banner"]');
      const kept = Array.from(bar.children);
      for (const node of kept) node.remove();
      setTimeout(() => {
        for (const node of kept) bar.appendChild(node);
      }, 1200);
    }
  </script>
</body>
</html>
